version: '3.8'

services:
  alpha-geo-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: alpha-geo-engineering:latest
    container_name: alpha_geo_engineering_web
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - APP_ENV=production
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
